name: CI

# tag-release.yml listens for this workflow by name, so renaming it means
# updating that file too.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The project is in Xcode 27's format (objectVersion 90), which older
    # Xcodes cannot open. Xcode 27 is only on GitHub's preview image so far,
    # whose label is xcode-27; there is no macos-27, and a job asking for one
    # queues until it times out rather than failing.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than the newest Xcode_27*: the image also carries
      # release candidates, which should never build a release.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      # Unsigned: this only proves the app compiles. Signing is release.yml's
      # job, and only that job can reach the certificate.
      - name: Build the app
        run: |
          xcodebuild build \
            -project Sketchframe/Sketchframe.xcodeproj -scheme Sketchframe \
            -configuration Release -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # --ignore-scripts: postinstall runs skpm-link, which tries to install
      # the plugin into Sketch on the runner.
      - name: Build the Sketch plugin
        working-directory: plugin
        run: |
          npm ci --ignore-scripts
          npm run build

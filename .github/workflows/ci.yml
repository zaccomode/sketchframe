name: CI

# tag-release.yml listens for this workflow by name, so renaming it means
# updating that file too.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The project is in Xcode 27's format (objectVersion 90), which older
    # Xcodes cannot open. Xcode 27 is only on GitHub's preview image so far,
    # whose label is xcode-27; there is no macos-27, and a job asking for one
    # queues until it times out rather than failing.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than the newest Xcode_27*: the image also carries
      # release candidates, which should never build a release.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      # Unsigned: this only proves the app compiles. Signing is release.yml's
      # job, and only that job can reach the certificate.
      - name: Build the app
        run: |
          xcodebuild build \
            -project mac/Sketchframe.xcodeproj -scheme Sketchframe \
            -configuration Release -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      # --ignore-scripts: postinstall runs skpm-link, which tries to install
      # the plugin into Sketch on the runner.
      - name: Build the Sketch plugin
        working-directory: plugin
        run: |
          npm ci --ignore-scripts
          npm run build

  extension:
    # Nothing here needs macOS, and the xcode-27 preview image can queue.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: the tests run the TypeScript sources directly, which needs
      # Node's built-in type stripping.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install
        working-directory: vscode
        run: npm ci

      - name: Typecheck
        working-directory: vscode
        run: npm run typecheck

      - name: Test
        working-directory: vscode
        run: npm test

      # Packaging is where bundling problems show up: a dependency esbuild
      # can't follow builds fine and only fails when VS Code loads it.
      - name: Package
        working-directory: vscode
        run: npm run package

      - name: Upload the .vsix, so a pull request's build can be installed and tried
        uses: actions/upload-artifact@v7
        with:
          name: sketchframe-vscode
          path: vscode/*.vsix
          if-no-files-found: error

  tools:
    # The shared core, and the CLI and MCP server on it. Linux on purpose:
    # that's where cloud agent sessions run them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24: the tests run the TypeScript sources directly, which needs
      # Node's built-in type stripping.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/core/package-lock.json
            packages/cli/package-lock.json

      - name: Typecheck and test the core
        working-directory: packages/core
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Typecheck, test and build the CLI
        working-directory: packages/cli
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      # package.json promises Node 18, which has no type stripping, so this
      # runs the bundle rather than the sources.
      - uses: actions/setup-node@v7
        with:
          node-version: 18

      - name: Run the bundle on Node 18
        run: |
          set -euo pipefail
          cli=packages/cli/dist/sketchframe.cjs
          node "$cli" pack packages/core/test/fixtures/Cards.sketchframe "$RUNNER_TEMP/Cards.sketchframe"
          node "$cli" outline "$RUNNER_TEMP/Cards.sketchframe"
          node "$cli" crop "$RUNNER_TEMP/Cards.sketchframe" n2 -o "$RUNNER_TEMP/card.png"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | node packages/cli/dist/sketchframe-mcp.cjs | grep get_screenshot > /dev/null

      - name: Upload the CLI bundle, so a pull request's build can be tried
        uses: actions/upload-artifact@v7
        with:
          name: sketchframe-cli
          path: packages/cli/dist/*.cjs
          if-no-files-found: error
